name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Check Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tool
        run: pip install flake8


      - name: Run flake8
        run: flake8 src/ tests/ --max-line-length=100

  test:
    name: Run test in docker
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t textutils-tests .

      - name: Run test in docker
        run: docker run --rm textutils-tests


      
